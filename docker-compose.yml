services:
  db:
    image: postgres:16-alpine
    container_name: petronix_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adminsecret
      POSTGRES_DB: petronix_db
    ports:
      - "5432:5432"
    volumes:
      # Old backup.sql has outdated schema (missing nameUz/nameRu/nameEn, price fields).
      # Prisma db push creates the correct schema on startup.
      # - ./backup.sql:/docker-entrypoint-initdb.d/backup.sql
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: petronix_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: petronix_backend
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: "postgresql://postgres:adminsecret@db:5432/petronix_db"
      REDIS_URL: "redis://redis:6379"
      PORT: 3001
      # Secrets come from your local .env (never committed). See .env.example.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      ADMIN_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      JWT_SECRET: "${JWT_SECRET:-dev-insecure-secret-do-not-use-in-prod}"
    ports:
      - "3001:3001"
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://${SERVER_HOST:-localhost}:3001/api"
    container_name: petronix_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
