# Production docker-compose
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# Before running, set your server IP or domain:
#   export SERVER_HOST=your-server-ip-or-domain
#
# Example:
#   export SERVER_HOST=185.200.10.50
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: petronix_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-adminsecret}
      POSTGRES_DB: petronix_db
    # ports not exposed — backend connects via internal Docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: petronix_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: petronix_backend
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      NODE_ENV: production
      # All secrets are required from .env — no defaults committed to the repo.
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/petronix_db"
      REDIS_URL: "redis://redis:6379"
      PORT: 3001
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:?set TELEGRAM_CHAT_ID in .env}"
      BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      ADMIN_CHAT_ID: "${TELEGRAM_CHAT_ID}"
      JWT_SECRET: "${JWT_SECRET:?set a strong JWT_SECRET in .env}"
    ports:
      - "3001:3001"
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Браузер ходит на тот же https-домен, nginx проксирует /api на backend:3001.
        # Так не возникает mixed content на https://petronix.uz
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-https://petronix.uz/api}"
    container_name: petronix_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
